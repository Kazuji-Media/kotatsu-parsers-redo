name: PT-BR parser fixtures

on:
  push:
    branches:
      - agent/fontes-pt-br
      - agent/issue-8-chapter-batches
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Run deterministic PT-BR parser tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --stacktrace \
            --tests '*NexusMangasWebViewTest' \
            --tests '*LeitorDeMangaBrowserActionTest' \
            --tests '*MangaCatalogParserSearchTest' \
            --tests '*MangaCatalogParserCompletenessTest' \
            --tests '*BorutoExplorerTest' \
            --tests '*HuntersScanTest' \
            --tests '*NinjaScanTest'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt-br-parser-test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
